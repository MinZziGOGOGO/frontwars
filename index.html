<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Front Wars</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%94%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1f1e;--panel:#2d3a2c;--green:#4a7c3f;--gold:#c4a458;--blue:#4a90d9;--red:#d94a4a;--text:#e0e0e0}
body{background:var(--bg);color:var(--gold);font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;height:100vh;display:flex}
#main{display:flex;flex:1;min-width:0;min-height:0}
#game{flex:1 1 0;min-width:0;min-height:0;display:block;cursor:pointer;touch-action:none}
#sidebar{width:220px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--green)}
#sidebar h2{color:var(--green);font-size:14px}
#turn{font-size:12px;font-weight:bold}
#funds{font-size:16px;font-weight:bold}
#funds small{color:var(--green);font-size:11px}
.info{background:var(--bg);padding:8px;border-radius:4px;font-size:12px;line-height:1.6;min-height:96px;color:var(--text)}
.hp{display:block;height:8px;background:var(--bg);border:1px solid #444;border-radius:2px;margin:3px 0}
.hp i{display:block;height:100%;border-radius:2px}
#sidebar button{background:var(--green);color:var(--bg);border:none;padding:8px;cursor:pointer;font:bold 13px inherit;border-radius:4px}
#sidebar button:hover:not(:disabled){background:var(--gold)}
#sidebar button:disabled{opacity:.4;cursor:default}
#help{font-size:10px;color:#8a9a88;line-height:1.5;margin-top:auto}
#minimap{border:2px solid var(--green);background:#000;align-self:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:14px;padding:16px;text-align:center}
.overlay.show{display:flex}
.overlay h1{font-size:32px;text-shadow:0 0 20px #c4a45840}
.overlay h2{font-size:22px}
.overlay p{color:var(--text);max-width:440px;line-height:1.6;font-size:13px}
.overlay button{background:var(--green);color:var(--bg);border:none;padding:11px 26px;font:bold 15px inherit;border-radius:6px;cursor:pointer;min-width:220px}
.overlay button:hover{background:var(--gold)}
.overlay label{color:var(--text);font-size:13px}
#buy-panel{display:none;position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--green);border-radius:6px;padding:8px;gap:6px;z-index:20;flex-wrap:wrap;justify-content:center;max-width:90vw}
#buy-panel.show{display:flex}
#buy-panel button{background:var(--bg);color:var(--gold);border:1px solid var(--green);padding:6px 10px;font:12px inherit;border-radius:4px;cursor:pointer;min-width:84px}
#buy-panel button:hover:not(:disabled){background:var(--green);color:var(--bg)}
#buy-panel button:disabled{opacity:.35;cursor:default}
@media(max-width:700px){
  body{flex-direction:column}
  #main{flex-direction:column}
  #sidebar{width:auto;border-left:none;border-top:2px solid var(--green);flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px}
  .info,#help,#minimap,#sidebar h2{display:none}
  #sidebar button{flex:1}
}
</style>
</head>
<body>
<div id="main">
  <canvas id="game"></canvas>
  <div id="sidebar">
    <h2>⚔ FRONT WARS</h2>
    <div id="turn"></div>
    <div id="funds"></div>
    <div class="info" id="info"></div>
    <button id="btn-wait" disabled>Wait</button>
    <button id="btn-end">End Turn</button>
    <button id="btn-menu-side">Menu</button>
    <canvas id="minimap" width="160" height="160"></canvas>
    <div id="help">
      Click a unit to select it.<br>
      Blue tiles: move · Red tiles: attack.<br>
      Infantry and mechs capture cities and HQs by ending turns on them.<br>
      Click your own empty city or HQ to buy units.<br>
      Drag to scroll the map.
    </div>
  </div>
</div>

<div id="menu" class="overlay show">
  <h1>⚔ FRONT WARS</h1>
  <button id="btn-skirmish">Skirmish vs AI</button>
  <button id="btn-campaign">Campaign</button>
  <button id="btn-hotseat">2 Players (same device)</button>
  <button id="btn-continue">Continue saved game</button>
  <label><input type="checkbox" id="opt-fog" checked> Fog of war in skirmish</label>
</div>

<div id="mission" class="overlay">
  <h2 id="mission-title"></h2>
  <p id="mission-text"></p>
  <button id="btn-mission-start">Begin Mission</button>
</div>

<div id="handover" class="overlay">
  <h2 id="handover-title"></h2>
  <p>Hand the device over, then continue.</p>
  <button id="btn-handover">Start turn</button>
</div>

<div id="game-over" class="overlay">
  <h2 id="go-title"></h2>
  <p id="go-sub"></p>
  <button id="btn-next">Next Mission</button>
  <button id="btn-restart">Play Again</button>
  <button id="btn-menu">Main Menu</button>
</div>

<div id="buy-panel"></div>

<script src="engine.js"></script>
<script src="main.js"></script>
</body>
</html>
